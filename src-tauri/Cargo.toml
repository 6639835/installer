[package]
name = "fbw-installer"
version = "3.7.1-dev.1"
description = "Desktop application to install and customize FlyByWire addons"
authors = ["FlyByWire Simulations <contact@flybywiresim.com>"]
edition = "2021"
license = "GPL-3.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6"
fs2 = "0.4"
opener = "0.7"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
